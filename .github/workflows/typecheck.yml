name: Type check

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: ruff (ANN, TCH)
        run: uv run ruff check --select ANN,TCH .

      - name: mypy
        run: uv run mypy .
