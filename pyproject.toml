[project]
name = "sib-utrecht-tools"
version = "0.1.0"
description = "Tools for member administration of SIB-Utrecht."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beaupy>=3.10.2",
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.14",
    "dkimpy>=1.1.8",
    "flask>=3.1.2",
    "google-api-python-client>=2.187.0",
    "google-auth>=2.45.0",
    "gunicorn>=23.0.0",
    "jsonpatch>=1.33",
    "keyring>=25.7.0",
    "keyrings-cryptfile>=1.3.9",
    "python-dotenv>=1.2.1",
    "pytz>=2025.2",
    "regex>=2025.11.3",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "traitlets>=5.14.3",
    "unidecode>=1.4.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[cognito-idp,iam,s3,ses,sts]>=1.42.68",
    "mypy>=1.19.1",
    "ruff>=0.15.6",
    "types-gunicorn>=25.1.0.20260215",
    "types-pytz>=2026.1.1.20260304",
    "types-regex>=2026.2.28.20260301",
    "types-requests>=2.32.4.20260107",
    "types-tabulate>=0.10.0.20260308",
]

[tool.mypy]
python_version = "3.13"
exclude = "(^|/)sib_tools/email/experimental/.*\\.py$"

[[tool.mypy.overrides]]
module = [
    "googleapiclient",
    "googleapiclient.*",
    "beaupy",
    "dkim",
]
ignore_missing_imports = true
